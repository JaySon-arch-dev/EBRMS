<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f5f8ff">
    <meta name="robots" content="noindex">

    <title>Borrowing Requests | EBRMS Admin</title>

    <link rel="stylesheet" href="/shared-view/style.css">
    <link rel="stylesheet" href="/admin/style.css">
    <script>
        // Setup help: if a script file is missing or crashes, say so on the
        // page instead of staying on "Loading...".
        (function () {
            function say(text) {
                var box = document.getElementById("itemEmpty");
                if (box && /Loading/.test(box.textContent)) box.textContent = text;
            }

            window.addEventListener("error", function (event) {
                var target = event.target || {};
                var file = target.src || target.href;
                say(file
                    ? "This file didn't load: " + file
                    : "Script error: " + event.message);
            }, true);

            window.addEventListener("load", function () {
                setTimeout(function () {
                    if (!window.ADMIN) {
                        say("The admin scripts didn't start. Check that /admin/common.js loads.");
                    }
                }, 1500);
            });
        })();
    </script>
    <!-- ===== SESSION HANDLER (added): hide the page until the session is verified ===== -->
    <style>body { visibility: hidden; }</style>
    <!-- ===== END SESSION HANDLER ===== -->
</head>
<!-- SESSION HANDLER (added): data-require-session="false" on the body tag below -->
<body data-require-session="false" data-role="Admin" data-page="dashboard" data-home="/admin/">

    <!-- Top bar -->
    <header class="topbar">
        <button type="button" class="menu-toggle" id="menuToggle"
                aria-label="Open menu" aria-controls="menuPanel"
                aria-expanded="false">
            <svg class="icon-open" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M4 7h16M4 12h16M4 17h16"
                      stroke="currentColor" stroke-width="1.9"
                      stroke-linecap="round"/>
            </svg>
            <svg class="icon-close" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M6 6l12 12M18 6 6 18"
                      stroke="currentColor" stroke-width="1.9"
                      stroke-linecap="round"/>
            </svg>
        </button>

        <a class="brand-logo" href="/admin/" aria-label="EBRMS admin">
            <span class="brand-logo-mark" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none">
                    <rect x="3.5" y="3.5" width="17" height="17" rx="5"
                          stroke="currentColor" stroke-width="1.8"/>
                    <path d="M8 8h8M8 12h8M8 16h5"
                          stroke="currentColor" stroke-width="1.8"
                          stroke-linecap="round"/>
                </svg>
            </span>
            <span>EBRMS<span class="brand-period">.</span></span>
        </a>

        <span class="topbar-spacer"></span>
        <span class="role-badge">Admin</span>
    </header>

    <div class="menu-scrim" id="menuScrim"></div>

    <div class="layout">

        <!-- Menu box: always visible on desktop, expands on mobile -->

            <div class="menu-head">

                        <path d="M19 12H5m6-6-6 6 6 6"
                              stroke="currentColor" stroke-width="1.9"
                              stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    Back
                </button>
                <span class="menu-title">NAVIGATION</span>
            </div>

            <div class="user-chip">
                <span class="avatar" aria-hidden="true">A</span>
                <div class="user-chip-copy">
                    <strong>Admin</strong>
                    <span>Signed in</span>
                </div>
            </div>

            <p class="menu-label">MENU</p>

            <nav class="menu-nav" aria-label="Admin pages">
                <a class="menu-link" href="/admin/" data-nav="dashboard">
                    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M8 5H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><rect x="8" y="3" width="8" height="5" rx="1.5" stroke="currentColor" stroke-width="1.7"/><path d="m8 14 2.5 2.5L16 11" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    Borrowing Requests
                </a>

                <a class="menu-link" href="/admin/equipment_management/" data-nav="equipment">
                    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3" stroke="currentColor" stroke-width="1.7"/><path d="M3 9h18M8 4v5" stroke="currentColor" stroke-width="1.7"/><circle cx="8" cy="14" r="1.2" fill="currentColor"/><circle cx="12" cy="14" r="1.2" fill="currentColor"/><circle cx="16" cy="14" r="1.2" fill="currentColor"/></svg>
                    Equipment Management
                </a>

                <a class="menu-link" href="/admin/user_management/" data-nav="users">
                    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="9" cy="8" r="3.5" stroke="currentColor" stroke-width="1.7"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18.5 14.2A6.5 6.5 0 0 1 21.5 20" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
                    User Management
                </a>

                <a class="menu-link" href="/admin/return/" data-nav="returns">
                    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M9 14 4 9l5-5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    Return Requests
                </a>

                <a class="menu-link" href="/admin/profile/" data-nav="profile">
                    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="1.7"/><path d="M4.5 20a7.5 7.5 0 0 1 15 0" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
                    Profile
                </a>
            </nav>

            <div class="menu-foot">
                <a class="signout-button" href="/logout/">
                    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                        <path d="M9 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h3"
                              stroke="currentColor" stroke-width="1.8"
                              stroke-linecap="round"/>
                        <path d="M15 8l4 4-4 4M19 12H9"
                              stroke="currentColor" stroke-width="1.8"
                              stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    Sign out
                </a>
            </div>
        </aside>

        <main class="content">
            <div class="page-head">
                <button type="button" class="back-button" data-back hidden>
                    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                        <path d="M19 12H5m6-6-6 6 6 6"
                              stroke="currentColor" stroke-width="1.9"
                              stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    Back
                </button>

                <div>
                    <h1>Borrowing Requests</h1>
                    <p>Review and respond to borrowing requests.</p>
                </div>
            </div>


            <section class="list-panel" aria-label="Borrowing requests">
                <div class="list-head" role="group" aria-label="Filter requests">
                    <button type="button" class="chip" data-filter="all" aria-pressed="true">
                        All <span class="chip-count" data-count="all">0</span>
                    </button>
                    <button type="button" class="chip" data-filter="pending" aria-pressed="false">
                        Pending <span class="chip-count" data-count="pending">0</span>
                    </button>
                    <button type="button" class="chip" data-filter="approved" aria-pressed="false">
                        Approved <span class="chip-count" data-count="approved">0</span>
                    </button>
                    <button type="button" class="chip" data-filter="rejected" aria-pressed="false">
                        Rejected <span class="chip-count" data-count="rejected">0</span>
                    </button>
                </div>

                <div class="list-scroll" tabindex="0" aria-label="Scrollable request list">
                    <!-- Rows are added by /admin/request.js from the database. -->
                    <ul class="item-list" id="itemList"></ul>

                    <p class="list-empty" id="itemEmpty">Loading requests&hellip;</p>
                </div>
            </section>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- ===== SESSION HANDLER (added): must load before view.js ===== -->
    <script src="/shared-view/session.js"></script>
    <!-- ===== END SESSION HANDLER ===== -->

    <script src="/shared-view/view.js"></script>
    <script src="/admin/common.js"></script>
    <script src="/admin/request.js"></script>
</body>
