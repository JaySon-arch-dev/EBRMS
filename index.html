<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EBRMS Login</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="login-container">

        <section class="login-card">

            <h1>EBRMS</h1>

            <p class="subtitle">
                Equipment Borrowing and Returning
                Management System
            </p>

            <form id="loginForm">

                <!-- USER ID -->
                <div class="form-group">

                    <label for="userId">
                        User ID
                    </label>

                    <input
                        type="text"
                        id="userId"
                        placeholder="Enter User ID"
                        autocomplete="username"
                        required
                    >

                </div>


                <!-- PASSWORD -->
                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="password-container">

                        <input
                            type="password"
                            id="password"
                            placeholder="Enter Password"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            id="togglePassword"
                        >
                            Show
                        </button>

                    </div>

                </div>


                <!-- LOGIN BUTTON -->
                <button
                    type="submit"
                    id="loginButton"
                    class="login-button"
                >
                    Login
                </button>


                <!-- NOTIFICATION -->
                <div
                    id="message"
                    class="message"
                    role="alert"
                ></div>

            </form>


            <!-- SUCCESS INFORMATION -->
            <div
                id="userInfo"
                class="user-info hidden"
            >

                <h2>Login Successful</h2>

                <p>
                    Welcome,
                    <strong id="displayName"></strong>
                </p>

                <p>
                    Role:
                    <strong id="displayRole"></strong>
                </p>

            </div>

        </section>

    </main>


    <!-- SUPABASE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- YOUR JAVASCRIPT -->
    <script src="script.js"></script>

</body>
</html>
